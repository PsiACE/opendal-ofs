services:
  audit:
    image: python:3.13-alpine3.22
    stop_grace_period: 1s
    command:
      - python
      - /fixture/audit.py
      - --log
      - /evidence/audit.jsonl
      - --ready
      - /tmp/audit.ready
    volumes:
      - ./audit.py:/fixture/audit.py:ro,Z
      - ${OFS_MANAGED_SYNC_AUDIT_LOG:-/tmp/ofs-managed-sync-audit.jsonl}:/evidence/audit.jsonl:Z

  bub-a: &bub-client
    build:
      context: ../..
      dockerfile: fixtures/managed-sync/bub.Dockerfile
    image: ${OFS_BUB_IMAGE:-opendal-ofs-managed-sync-bub:local}
    depends_on:
      - minio
    network_mode: host
    environment: &bub-environment
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: minioadmin
      HOME: /var/lib/bub
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost

  bub-b:
    <<: *bub-client
    environment:
      <<: *bub-environment

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data
    environment:
      MINIO_AUDIT_WEBHOOK_BATCH_SIZE_HARNESS: "1"
      MINIO_AUDIT_WEBHOOK_ENABLE_HARNESS: ${OFS_MANAGED_SYNC_AUDIT_ENABLE:-off}
      MINIO_AUDIT_WEBHOOK_ENDPOINT_HARNESS: http://audit:8080
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
      NO_PROXY: audit,minio,127.0.0.1,localhost
      no_proxy: audit,minio,127.0.0.1,localhost
    ports:
      - "127.0.0.1:${OFS_MANAGED_SYNC_MINIO_PORT:-19000}:9000"
    volumes:
      - minio-data:/data

  minio-client:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    entrypoint:
      - mc
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
      MC_NO_COLOR: "1"
      MC_QUIET: "1"
      NO_PROXY: minio,127.0.0.1,localhost
      no_proxy: minio,127.0.0.1,localhost

volumes:
  minio-data:
